services:
  # PostgreSQL Database
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecommerce-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Catalog Microservice
  catalog:
    build: 
      context: ./catalog
      dockerfile: Dockerfile
    environment:
      SECRET_KEY: ${CATALOG_SECRET_KEY}
      DEBUG: "False"
      USE_SQLITE: "False"
      POSTGRES_DB: ms_catalog
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      ALLOWED_HOSTS: "*,traefik"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "curl", "-f", "-4", "http://localhost:8001/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
      - traefik-public
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.catalog.rule=PathPrefix(`/api/catalog`)"
      - "traefik.http.routers.catalog.entrypoints=web"
      - "traefik.http.services.catalog.loadbalancer.server.port=8001"
      - "traefik.http.middlewares.catalog-strip.stripprefix.prefixes=/api/catalog"
      - "traefik.http.routers.catalog.middlewares=catalog-strip"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: 
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py seed_products || true &&
        /app/.venv/bin/gunicorn main.wsgi:application \
          --bind 0.0.0.0:8001 \
          --workers 4 \
          --timeout 30 \
          --access-logfile - \
          --error-logfile - \
          --log-level info

  # Payments Microservice
  payments:
    build:
      context: ./payments
      dockerfile: Dockerfile
    environment:
      SECRET_KEY: ${PAYMENTS_SECRET_KEY}
      DEBUG: "False"
      POSTGRES_DB: ms_payments
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      ALLOWED_HOSTS: "*,traefik"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "curl", "-f", "-4", "http://localhost:8002/payments/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
      - traefik-public
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.payments.rule=PathPrefix(`/api/payments`)"
      - "traefik.http.routers.payments.entrypoints=web"
      - "traefik.http.services.payments.loadbalancer.server.port=8002"
      - "traefik.http.middlewares.payments-strip.stripprefix.prefixes=/api/payments"
      - "traefik.http.routers.payments.middlewares=payments-strip"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        /app/.venv/bin/gunicorn main.wsgi:application \
          --bind 0.0.0.0:8002 \
          --workers 4 \
          --timeout 30 \
          --access-logfile - \
          --error-logfile - \
          --log-level info

  # Inventory Microservice
  inventory:
    build:
      context: ./inventory
      dockerfile: Dockerfile
    environment:
      SECRET_KEY: ${INVENTORY_SECRET_KEY}
      DEBUG: "False"
      USE_SQLITE: "False"
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_DB: ms_inventory
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      ALLOWED_HOSTS: "*,traefik"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "curl", "-f", "-4", "http://localhost:8003/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
      - traefik-public
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.inventory.rule=PathPrefix(`/api/inventory`)"
      - "traefik.http.routers.inventory.entrypoints=web"
      - "traefik.http.services.inventory.loadbalancer.server.port=8003"
      - "traefik.http.middlewares.inventory-strip.stripprefix.prefixes=/api/inventory"
      - "traefik.http.routers.inventory.middlewares=inventory-strip"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py seed_inventory || true &&
        /app/.venv/bin/gunicorn config.wsgi:application \
          --bind 0.0.0.0:8003 \
          --workers 4 \
          --timeout 30 \
          --access-logfile - \
          --error-logfile - \
          --log-level info

  # Purchases Microservice
  purchases:
    build:
      context: ./purchases
      dockerfile: Dockerfile
    environment:
      SECRET_KEY: ${PURCHASES_SECRET_KEY}
      DEBUG: "False"
      POSTGRES_DB: ms_purchases
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ALLOWED_HOSTS: "*,traefik"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "curl", "-f", "-4", "http://localhost:8004/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
      - traefik-public
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.purchases.rule=PathPrefix(`/api/purchases`)"
      - "traefik.http.routers.purchases.entrypoints=web"
      - "traefik.http.services.purchases.loadbalancer.server.port=8004"
      - "traefik.http.middlewares.purchases-strip.stripprefix.prefixes=/api/purchases"
      - "traefik.http.routers.purchases.middlewares=purchases-strip"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        /app/.venv/bin/gunicorn main.wsgi:application \
          --bind 0.0.0.0:8004 \
          --workers 4 \
          --timeout 30 \
          --access-logfile - \
          --error-logfile - \
          --log-level info

  # Saga Orchestrator
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    environment:
      CATALOG_URL: http://traefik/api/catalog
      PAYMENTS_URL: http://traefik/api/payments
      INVENTORY_URL: http://traefik/api/inventory
      PURCHASES_URL: http://traefik/api/purchases
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      WORKERS: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "-4", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      - sh
      - -c
      - |
        /app/.venv/bin/gunicorn app.main:app \
          --bind 0.0.0.0:8000 \
          --workers 1 \
          --worker-class uvicorn.workers.UvicornWorker \
          --timeout 30 \
          --access-logfile - \
          --error-logfile - \
          --log-level info
    depends_on:
      catalog:
        condition: service_healthy
      payments:
        condition: service_healthy
      inventory:
        condition: service_healthy
      purchases:
        condition: service_healthy
    networks:
      - ecommerce-network
      - traefik-public
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.orchestrator.rule=PathPrefix(`/api/saga`)"
      - "traefik.http.routers.orchestrator.entrypoints=web"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.orchestrator-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.orchestrator.middlewares=orchestrator-strip"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ecommerce-network:
    driver: bridge
    name: ecommerce-network
  traefik-public:
    external: true

volumes:
  postgres_data:
    name: ecommerce-postgres-data
