services:
  # PostgreSQL Database
  postgres:
    image: postgres:latest
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # Catalog Microservice
  catalog:
    build: ./catalog
    container_name: ecommerce-catalog
    environment:
      SECRET_KEY: ${CATALOG_SECRET_KEY:-django-insecure-key}
      DEBUG: ${DEBUG:-False}
      USE_SQLITE: "False"
      POSTGRES_DB: ms_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py seed_products &&
        python manage.py runserver 0.0.0.0:8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Payments Microservice
  payments:
    build: ./payments
    container_name: ecommerce-payments
    environment:
      SECRET_KEY: ${PAYMENTS_SECRET_KEY:-django-insecure-key}
      DEBUG: ${DEBUG:-False}
      USE_SQLITE: "False"
      POSTGRES_DB: ms_payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/payments/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8002

  # Inventory Microservice
  inventory:
    build: ./inventory
    container_name: ecommerce-inventory
    environment:
      SECRET_KEY: ${INVENTORY_SECRET_KEY:-django-insecure-key}
      DEBUG: ${DEBUG:-False}
      USE_SQLITE: "False"
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_DB: ms_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py seed_inventory &&
        python manage.py runserver 0.0.0.0:8003
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Purchases Microservice
  purchases:
    build: ./purchases
    container_name: ecommerce-purchases
    environment:
      SECRET_KEY: ${PURCHASES_SECRET_KEY:-django-insecure-key}
      DEBUG: ${DEBUG:-False}
      USE_SQLITE: "False"
      POSTGRES_DB: ms_purchases
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8004

  # Saga Orchestrator
  orchestrator:
    build: ./orchestrator
    container_name: ecommerce-orchestrator
    environment:
      CATALOG_URL: http://catalog:8001
      PAYMENTS_URL: http://payments:8002
      INVENTORY_URL: http://inventory:8003
      PURCHASES_URL: http://purchases:8004
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKERS: "1"
    ports:
      - "8000:8000"
    depends_on:
      catalog:
        condition: service_healthy
      payments:
        condition: service_healthy
      inventory:
        condition: service_healthy
      purchases:
        condition: service_healthy
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
    name: ecommerce-network

volumes:
  postgres_data:
    name: ecommerce-postgres-data
