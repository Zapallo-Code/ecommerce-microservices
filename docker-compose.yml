services:
  # PostgreSQL Database
  postgres:
    image: postgres:latest
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # Catalog Microservice
  catalog:
    build: ./catalog
    container_name: ecommerce-catalog
    environment:
      SECRET_KEY: ${CATALOG_SECRET_KEY:-django-insecure-key}
      DEBUG: ${DEBUG:-False}
      USE_SQLITE: "False"
      POSTGRES_DB: ms_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catalog.rule=PathPrefix(`/api/catalog`)"
      - "traefik.http.routers.catalog.entrypoints=web"
      - "traefik.http.services.catalog.loadbalancer.server.port=8001"
      - "traefik.http.middlewares.catalog-strip.stripprefix.prefixes=/api/catalog"
      - "traefik.http.routers.catalog.middlewares=catalog-strip"
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py seed_products || true &&
        python manage.py runserver 0.0.0.0:8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Payments Microservice
  payments:
    build: ./payments
    container_name: ecommerce-payments
    environment:
      SECRET_KEY: ${PAYMENTS_SECRET_KEY:-django-insecure-key}
      DEBUG: ${DEBUG:-False}
      USE_SQLITE: "False"
      POSTGRES_DB: ms_payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.payments.rule=PathPrefix(`/api/payments`)"
      - "traefik.http.routers.payments.entrypoints=web"
      - "traefik.http.services.payments.loadbalancer.server.port=8002"
      - "traefik.http.middlewares.payments-strip.stripprefix.prefixes=/api/payments"
      - "traefik.http.routers.payments.middlewares=payments-strip"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/payments/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8002

  # Inventory Microservice
  inventory:
    build: ./inventory
    container_name: ecommerce-inventory
    environment:
      SECRET_KEY: ${INVENTORY_SECRET_KEY:-django-insecure-key}
      DEBUG: ${DEBUG:-False}
      USE_SQLITE: "False"
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_DB: ms_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.inventory.rule=PathPrefix(`/api/inventory`)"
      - "traefik.http.routers.inventory.entrypoints=web"
      - "traefik.http.services.inventory.loadbalancer.server.port=8003"
      - "traefik.http.middlewares.inventory-strip.stripprefix.prefixes=/api/inventory"
      - "traefik.http.routers.inventory.middlewares=inventory-strip"
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py seed_inventory || true &&
        python manage.py runserver 0.0.0.0:8003
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Purchases Microservice
  purchases:
    build: ./purchases
    container_name: ecommerce-purchases
    environment:
      SECRET_KEY: ${PURCHASES_SECRET_KEY:-django-insecure-key}
      DEBUG: ${DEBUG:-False}
      USE_SQLITE: "False"
      POSTGRES_DB: ms_purchases
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.purchases.rule=PathPrefix(`/api/purchases`)"
      - "traefik.http.routers.purchases.entrypoints=web"
      - "traefik.http.services.purchases.loadbalancer.server.port=8004"
      - "traefik.http.middlewares.purchases-strip.stripprefix.prefixes=/api/purchases"
      - "traefik.http.routers.purchases.middlewares=purchases-strip"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8004

  # Saga Orchestrator
  orchestrator:
    build: ./orchestrator
    container_name: ecommerce-orchestrator
    environment:
      CATALOG_URL: http://traefik/api/catalog
      PAYMENTS_URL: http://traefik/api/payments
      INVENTORY_URL: http://traefik/api/inventory
      PURCHASES_URL: http://traefik/api/purchases
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKERS: "1"
    depends_on:
      catalog:
        condition: service_healthy
      payments:
        condition: service_healthy
      inventory:
        condition: service_healthy
      purchases:
        condition: service_healthy
    networks:
      - ecommerce-network
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator.rule=PathPrefix(`/api/saga`)"
      - "traefik.http.routers.orchestrator.entrypoints=web"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.orchestrator-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.orchestrator.middlewares=orchestrator-strip"

networks:
  ecommerce-network:
    driver: bridge
    name: ecommerce-network
  traefik-public:
    external: true

volumes:
  postgres_data:
    name: ecommerce-postgres-data
